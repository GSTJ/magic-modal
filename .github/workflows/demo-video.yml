name: 🎬 Demo Video

# Re-renders apps/demo-video and overwrites two objects in R2. It writes
# nothing back to the repository.
#
# The mp4 is not one of them. Remotion renders video, and the GIF recipe is a
# second ffmpeg pass over that encode, so an mp4 exists on the runner — but it
# is an intermediate, not a deliverable. It stays in the package's gitignored
# out/ and is thrown away with the runner.
#
# media/ stays committed and stays the fallback: this job does not update it, so
# a source change that lands here leaves the tree's copy behind until someone
# runs `render:all` locally. Do that in the same PR that changes the
# composition — the workflow is what keeps the served copy honest afterwards,
# not a substitute for rendering before review.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/demo-video.yml"
      - "apps/demo-video/**"
  workflow_dispatch:

# Two overlapping runs would race each other writing the same two objects.
concurrency:
  group: render-demo-video
  cancel-in-progress: false

env:
  # Reused from GSTJ/gabriel-taveira-portfolio rather than a bucket of our own:
  # the custom domain is already bound and public there, so this repo adds a key
  # prefix and no Cloudflare infrastructure at all.
  R2_BUCKET: portfolio-assets
  R2_PREFIX: magic-modal
  ASSETS_BASE_URL: https://assets.gabrieltaveira.dev
  # There is no cache purge in this setup, so an object's max-age is the whole
  # freshness story after a re-render. Note the zone's Browser Cache TTL raises
  # anything lower than 4 hours, so browsers are told 14400 whatever this says.
  ASSET_CACHE_CONTROL: "public, max-age=3600"
  # `pnpm dlx` rather than a dependency, which is where this diverges from the
  # portfolio's version of this workflow. wrangler in the lockfile would be
  # installed by every `pnpm install --frozen-lockfile` in Branch Checkup, and
  # keeping the library's CI free of this package's tooling is the whole reason
  # apps/demo-video has no build, lint or typecheck script.
  WRANGLER_VERSION: 4.114.0

jobs:
  render:
    name: 🚀 Render and publish
    runs-on: ubuntu-latest
    # Reads the tree, builds the assets, pushes them to R2. No commits, no
    # branches, no PRs.
    permissions:
      contents: read

    steps:
      # Everything in this job is pinned by digest, including the actions the
      # rest of the repo takes on a major tag. This is the only job here that
      # holds a Cloudflare token with write access to a bucket that serves
      # gabrieltaveira.dev, so a moved tag is a bigger deal than it is in
      # Branch Checkup.
      - name: 🏗 Setup Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏗 Setup PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 🏗 Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      # Fail here rather than four minutes of rendering later, inside a wrangler
      # stack trace.
      #
      # "Missing" would be the wrong word for what this catches. A secret saved
      # with an empty value lists in the API exactly like a real one and arrives
      # on the runner as an empty string.
      - name: 🔑 Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          empty=""
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || empty="$empty CLOUDFLARE_API_TOKEN"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || empty="$empty CLOUDFLARE_ACCOUNT_ID"

          if [ -n "$empty" ]; then
            echo "::error::Repository secret(s) unset or set to an empty value:$empty. Listing the name proves nothing, re-save the value. The token needs Account > R2 > Edit on the account that owns $R2_BUCKET."
            exit 1
          fi

          # Cheapest call that proves all three things at once: the token
          # authenticates, the account id belongs to it, and it carries R2
          # permissions.
          if ! pnpm dlx "wrangler@$WRANGLER_VERSION" r2 bucket info "$R2_BUCKET"; then
            echo "::error::Both secrets have values but they cannot read $R2_BUCKET. Check the token has Account > R2 > Edit and that CLOUDFLARE_ACCOUNT_ID owns the bucket."
            exit 1
          fi

          echo "credentials reach $R2_BUCKET"

      # Remotion downloads its own headless shell on first use, and the GIF pass
      # runs through the ffmpeg that ships inside Remotion, so there is nothing
      # to apt-get here.
      - name: 🎬 Render mp4, GIF and poster
        run: pnpm --filter @magic-modal/demo-video render:all

      - name: 🔍 Report what was rendered
        run: |
          set -euo pipefail
          for f in media/magic-modal-demo.gif media/magic-modal-social.png; do
            echo "$f $(stat -c%s "$f") bytes  sha256=$(sha256sum "$f" | cut -d' ' -f1)"
          done

      # --remote is not optional. Without it wrangler v4 writes to a local
      # simulation on the runner, reports success, and uploads nothing.
      - name: ☁️ Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          put() {
            pnpm dlx "wrangler@$WRANGLER_VERSION" r2 object put "$R2_BUCKET/$R2_PREFIX/$1" \
              --remote \
              --file "$2" \
              --content-type "$3" \
              --cache-control "$ASSET_CACHE_CONTROL"
          }

          put demo.gif media/magic-modal-demo.gif "image/gif"
          put social.png media/magic-modal-social.png "image/png"

      # wrangler reporting "Upload complete" is not evidence, and neither is a
      # 200. Read the objects back over HTTPS from the custom domain and check
      # the bytes match what this run just built.
      - name: ✅ Verify what the custom domain serves
        run: |
          set -euo pipefail

          check() {
            local key="$1" local_file="$2" want_type="$3"
            local url="$ASSETS_BASE_URL/$R2_PREFIX/$key?ci=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

            curl --silent --show-error --fail --location "$url" --output "served-$key"

            local got_type
            got_type=$(curl --silent --show-error --fail --location --head "$url" \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type" {print $2}')

            local want_sum got_sum
            want_sum=$(sha256sum "$local_file" | cut -d' ' -f1)
            got_sum=$(sha256sum "served-$key" | cut -d' ' -f1)

            echo "$key: content-type=$got_type sha256=$got_sum"

            if [ "$got_type" != "$want_type" ]; then
              echo "::error::$key came back as '$got_type', expected '$want_type'"
              exit 1
            fi

            if [ "$want_sum" != "$got_sum" ]; then
              echo "::error::$key served $got_sum but this run built $want_sum"
              exit 1
            fi
          }

          # The cache-busting query is deliberate, and belongs here and nowhere
          # else. Cloudflare caches responses from an R2 custom domain,
          # including the 404s from before an object existed, so the bare URL
          # can lag a fresh upload. The README must link the bare URL.
          check demo.gif media/magic-modal-demo.gif "image/gif"
          check social.png media/magic-modal-social.png "image/png"

          echo "both objects match the ones this run built"
