name: 🛠️ Branch Checkup
on:
  pull_request:
    branches:
      - main
  # Also run on main itself. Publish was the only workflow watching main, so a
  # merge that broke lint or format stayed green until the next PR inherited it.
  # Renovate uses `prCreation: not-pending`, so its branches need this push run
  # before the bot can open a PR. Without it, they sit on the dependency
  # dashboard forever because no status check can start.
  push:
    branches:
      - main
      - "renovate/**"

# Reads the tree and nothing else. The pnpm and turbo caches go through the
# Actions cache service on the runtime token. Declared here because a called
# workflow can never exceed the caller's grant.
permissions:
  contents: read

jobs:
  # Install, lint, format and typecheck now live in GSTJ/magic, so every repo
  # runs the same steps. `concurrency` is declared inside the reusable workflow,
  # at job level — a `workflow_call` file never gets a run of its own, so a
  # workflow-level group there would never apply.
  checkup:
    # `@v1` is a moving major tag, so a fix in the shared workflow lands here on
    # the next run. Never `@main` — an unreviewed merge over there would reach
    # every repo's CI immediately.
    uses: GSTJ/magic/.github/workflows/ci.yml@v2
    with:
      # Includes the statically exported docs app, so broken routes, MDX, or
      # generated API tables cannot merge and fail only during deployment.
      build-command: pnpm run build
      test-command: pnpm run test
      # This repo's own gates. expo-doctor catches the duplicate react-native
      # and the SDK drift the example app is prone to. changelog:check renders
      # a synthetic history of every commit type through the real changelog
      # preset and fails if a breaking change goes missing — including one
      # hanging off a hidden type, which is how a `ci!:` would vanish.
      # release:check drives the real .release-it.js against a throwaway repo
      # at 10.1.1 and fails if the next major computes 11.0.0, which npm can
      # never accept again (unpublished on magic-modal, occupied on the shim).
      #
      # One `extra-command`, so they're chained. `&&` short-circuits, which is
      # what we want: any failing fails the job.
      extra-command: pnpm run doctor && pnpm run changelog:check && pnpm run release:check

  # main's ruleset requires a check literally named "👮‍♂️ Typecheck, Healthcheck,
  # Lint and Format". A called workflow always reports as
  # "<caller job> / <called job>", so `checkup` can never produce that context —
  # merging without this job would leave every future PR waiting on a check that
  # never arrives. This one carries the name instead, and is deletable the day
  # the ruleset is pointed at the shared workflow's own check, which is a
  # repository settings change rather than a change to this repo.
  #
  # `if: always()` matters: a job skipped because its dependency failed reports
  # as skipped, and a skipped required check counts as passed.
  validate:
    name: 👮‍♂️ Typecheck, Healthcheck, Lint and Format
    needs: checkup
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless the shared workflow passed
        run: '[ "${{ needs.checkup.result }}" = "success" ]'
