name: 🚀 Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact merged release commit to publish. Leave empty to inspect main.
        type: string
        required: false
      cleanup_branch:
        description: Temporary release branch to remove after verified publication.
        type: string
        required: false

concurrency:
  group: magic-modal-release
  cancel-in-progress: false

jobs:
  release:
    name: 🎉 Release
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || inputs.expected_sha != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - name: 🏗 Setup Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_sha || github.sha }}

      - name: 🔒 Verify manual release target
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ]
          git fetch origin main
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main

      - name: 🏗 Setup PNPM
        uses: pnpm/action-setup@v6

      - name: 🏗 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: 🏗 Get PNPM store directory
        id: pnpm-cache
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: 🏗 Setup PNPM cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      # Nothing below this step can see NPM_TOKEN. A merged commit has to pass
      # the same gates as a PR before the publishing step receives it.
      - name: 🧪 Prove the release tree
        run: |
          pnpm run build
          pnpm run lint
          pnpm run format
          pnpm run typecheck
          pnpm run test
          pnpm run doctor
          pnpm run changelog:check
          pnpm run release:check
          git diff --exit-code

      - name: 🔎 Classify the release
        id: state
        run: node packages/modal/tools/release-integrity.mjs classify

      - name: 💤 No package release due
        if: steps.state.outputs.mode == 'skip'
        run: echo "No qualifying package commits since the last release."

      - name: 📝 Prepare version and changelog
        if: steps.state.outputs.mode == 'prepare'
        run: |
          git config user.name "Gabriel Taveira"
          git config user.email "gabrielstaveira@gmail.com"
          pnpm --filter magic-modal run release
          pnpm --dir packages/react-native-magic-modal exec node tools/sync-manifest.mjs --write
          git add packages/modal/package.json packages/modal/CHANGELOG.md packages/react-native-magic-modal/package.json
          git commit --amend --no-edit
          node packages/modal/tools/release-integrity.mjs check

      - name: 🔁 Open the prepared release PR
        id: release-pr
        if: steps.state.outputs.mode == 'prepare'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/modal/package.json').version")
          BRANCH="chore/release-$VERSION"
          TITLE="chore(release): magic modal release v$VERSION"
          BODY=$(printf '%s\n' \
            "## Summary" \
            "" \
            "Prepare magic-modal $VERSION for publication." \
            "" \
            "## Details" \
            "" \
            "- Bump both package manifests to the same version." \
            "- Generate the $VERSION changelog from the reviewed commit history." \
            "- Publish only after this commit reaches main through the required checks." \
            "" \
            "## Testing steps" \
            "" \
            "The Publish workflow ran the full build, lint, format, typecheck, test, doctor, audit, changelog, and release-integrity gates before opening this PR." \
            "" \
            "Workflow proof: https://github.com/${{ github.repository }}/actions/runs/$RUN_ID")

          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"
          PR=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
            PR=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: ✅ Release the parked check run
        if: steps.release-pr.outputs.pr != ''
        uses: ./.github/actions/approve-parked-ci
        with:
          pull-request: ${{ steps.release-pr.outputs.pr }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🤝 Turn on auto-merge
        if: steps.release-pr.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.release-pr.outputs.pr }}
        run: |
          if gh pr merge "$PR" --auto --squash --delete-branch; then
            exit 0
          fi
          STATE=$(gh pr view "$PR" --json mergeStateStatus --jq .mergeStateStatus)
          if [ "$STATE" = "CLEAN" ]; then
            gh pr merge "$PR" --squash --delete-branch
          else
            echo "::error::Release PR #$PR is $STATE and auto-merge could not be enabled."
            exit 1
          fi

      # A PR merged by GITHUB_TOKEN does not emit another push workflow. Wait
      # for the checked release PR, pin a temporary ref to its squash commit,
      # and dispatch this workflow there. That also makes the provenance SHA
      # identical to the commit the tag will name.
      - name: ▶️ Dispatch publication from the merge commit
        if: steps.release-pr.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.release-pr.outputs.pr }}
        run: |
          set -euo pipefail
          for _attempt in $(seq 1 180); do
            STATE=$(gh pr view "$PR" --json state --jq .state)
            if [ "$STATE" = "MERGED" ]; then
              SHA=$(gh pr view "$PR" --json mergeCommit --jq .mergeCommit.oid)
              VERSION=$(gh pr view "$PR" --json title --jq '.title | capture("v(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)$").version')
              BRANCH="chore/release-publish-$VERSION"
              git fetch origin "$SHA"
              git push --force-with-lease origin "$SHA:refs/heads/$BRANCH"
              gh workflow run release.yml --ref "$BRANCH" -f expected_sha="$SHA" -f cleanup_branch="$BRANCH"
              exit 0
            fi
            if [ "$STATE" = "CLOSED" ]; then
              echo "::error::Release PR #$PR closed without merging."
              exit 1
            fi
            sleep 10
          done
          echo "::error::Release PR #$PR did not merge within 30 minutes."
          exit 1

      - name: 📦 Publish both package names
        if: steps.state.outputs.mode == 'publish'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=${{ steps.state.outputs.version }}
          TAG="magic-modal-$VERSION"
          HEAD=$(git rev-parse HEAD)

          if git rev-parse "$TAG^{commit}" >/dev/null 2>&1; then
            [ "$(git rev-parse "$TAG^{commit}")" = "$HEAD" ]
          else
            git tag --annotate "$TAG" --message "Magic Modal $VERSION"
          fi
          node packages/modal/tools/release-integrity.mjs check --tag

          if npm view "magic-modal@$VERSION" version >/dev/null 2>&1; then
            echo "magic-modal@$VERSION is already published."
          else
            pnpm --filter magic-modal publish --no-git-checks --access public --provenance
          fi

          if npm view "react-native-magic-modal@$VERSION" version >/dev/null 2>&1; then
            echo "react-native-magic-modal@$VERSION is already published."
          else
            pnpm --filter react-native-magic-modal publish --no-git-checks --access public --provenance
          fi

          # shellcheck disable=SC2016
          MESSAGE='Renamed to `magic-modal`. This package still works and tracks every release, but new code should install `magic-modal` instead. See https://github.com/GSTJ/magic-modal'
          npm deprecate "react-native-magic-modal@<$VERSION" "$MESSAGE"
          git push origin "refs/tags/$TAG"

      - name: 🏷 Publish GitHub release and verify registry state
        if: steps.state.outputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=${{ steps.state.outputs.version }}
          TAG="magic-modal-$VERSION"
          HEAD=$(git rev-parse HEAD)
          node packages/modal/tools/release-integrity.mjs check --tag
          node packages/modal/tools/release-integrity.mjs notes > "$RUNNER_TEMP/release-notes.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Magic Modal Release $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" --verify-tag --title "Magic Modal Release $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

          [ "$(gh api "repos/${{ github.repository }}/commits/$TAG" --jq .sha)" = "$HEAD" ]
          [ "$(npm view "magic-modal@$VERSION" version)" = "$VERSION" ]
          [ "$(npm view "react-native-magic-modal@$VERSION" version)" = "$VERSION" ]
          [ "$(npm view "magic-modal@$VERSION" gitHead)" = "$HEAD" ]
          [ "$(npm view "react-native-magic-modal@$VERSION" gitHead)" = "$HEAD" ]

      - name: 🧹 Remove the temporary publish branch
        if: steps.state.outputs.mode == 'publish' && inputs.cleanup_branch != ''
        env:
          CLEANUP_BRANCH: ${{ inputs.cleanup_branch }}
        run: |
          case "$CLEANUP_BRANCH" in
            chore/release-publish-*) git push origin --delete "$CLEANUP_BRANCH" ;;
            *) echo "::error::Refusing to delete unexpected branch $CLEANUP_BRANCH"; exit 1 ;;
          esac
