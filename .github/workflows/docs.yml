# Simple workflow for deploying static content to GitHub Pages
name: 📚 Docs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "apps/docs/**"
      - "packages/modal/package.json"
      - "packages/modal/src/**"
      - "README.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-docs:
    name: 🚀 Deploy Docs
    # release-it writes "[skip ci]", with a space. The old guard looked for
    # "[skip-ci]" and never matched anything, same bug release.yml had.
    if: "!contains(toJSON(github.event.commits.*.message), '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Setup Repo
        uses: actions/checkout@v7

      # No version pin: the action reads `packageManager` from the root
      # package.json, same as every other workflow. Pinning pnpm 8 here is
      # what broke the docs build. `nodeLinker: hoisted` moved from .npmrc to
      # pnpm-workspace.yaml in #224, and pnpm 8 doesn't read settings from
      # pnpm-workspace.yaml, so it installed an isolated store instead. That
      # leaves `expo` out of the root node_modules, and packages/modal's
      # tsconfig extends `expo/tsconfig.base`, so typedoc died on
      # "File 'expo/tsconfig.base' not found".
      - name: 🏗 Setup PNPM
        uses: pnpm/action-setup@v6

      - name: 🏗 Get PNPM store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: 🏗 Setup PNPM cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 🏗 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: "📦 Cache Node Modules"
        uses: actions/cache@v6.1.0
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      # The old dtinth action is unmaintained and its cache server now returns
      # 400/500 responses. This is the maintained Node 24 replacement.
      - name: 🏗 Setup Turborepo Cache
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - name: 🛠️ Setup Pages
        uses: actions/configure-pages@v6

      - name: 📚 Generate Docs
        run: pnpm run docs

      - name: 📩 Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./apps/docs/out"
          # Next assets live under _next. Preserve .nojekyll so GitHub Pages
          # serves that directory instead of handing the export to Jekyll.
          include-hidden-files: true

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
