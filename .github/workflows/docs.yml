# Simple workflow for deploying static content to GitHub Pages
name: 📚 Docs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "apps/docs/**"
      - "packages/modal/package.json"
      - "packages/modal/src/**"
      - "README.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-docs:
    name: 📚 Build Docs
    # release-it writes "[skip ci]", with a space. The old guard looked for
    # "[skip-ci]" and never matched anything, same bug release.yml had.
    if: "!contains(toJSON(github.event.commits.*.message), '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 🏗 Setup Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No version pin: the action reads `packageManager` from the root
      # package.json, same as every other workflow. Pinning pnpm 8 here is
      # what broke the docs build. `nodeLinker: hoisted` moved from .npmrc to
      # pnpm-workspace.yaml in #224, and pnpm 8 doesn't read settings from
      # pnpm-workspace.yaml, so it installed an isolated store instead. That
      # leaves `expo` out of the root node_modules, and packages/modal's
      # tsconfig extends `expo/tsconfig.base`, so typedoc died on
      # "File 'expo/tsconfig.base' not found".
      - name: 🏗 Setup PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: 🏗 Get PNPM store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: 🏗 Setup PNPM cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 🏗 Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: "📦 Cache Node Modules"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗 Restore Turborepo Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.repository_id }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.repository_id }}-${{ github.job }}-
            ${{ runner.os }}-${{ runner.arch }}-turbo-${{ github.repository_id }}-

      - name: 📚 Generate Docs
        run: pnpm run docs

      - name: 📩 Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: "./apps/docs/out"
          # Next assets live under _next. Preserve .nojekyll so GitHub Pages
          # serves that directory instead of handing the export to Jekyll.
          include-hidden-files: true

  deploy-docs:
    name: 🚀 Deploy Docs
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      id-token: write
      pages: write

    steps:
      - name: 🛠️ Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
