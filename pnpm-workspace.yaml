packages:
  - packages/*
  - examples/*
  - apps/*

nodeLinker: hoisted
dedupeDirectDeps: true

overrides:
  "metro": "^0.83.3"
  "metro-resolver": "^0.83.3"
  "metro-config": "^0.83.3"
  "@expo/metro-runtime": "55.0.12"
  "undici": "^8.0.0"
  "lodash": "^4.18.0"
  "tmp": "^0.2.6"
  "brace-expansion": "^5.0.9"
  "fast-uri": "^3.1.5"
  "hono": "^4.12.34"
  "js-yaml@3.15.0": "3.15.1"
  "js-yaml@4.3.0": "4.3.1"
  "nanoid@3.3.16": "3.3.17"
  "uuid": "^14.0.0"
  # Both of these reach us through next in apps/docs, and bumping next fixes
  # neither. It pins `"postcss": "8.4.31"` exactly and takes `sharp: "^0.34.5"`
  # as an optional dep, still true on 16.2.12, the latest release. An override
  # is the only lever.
  #
  # postcss 8.4.31 is GHSA-qx2v-qp2m-jg93, GHSA-6g55-p6wh-862q and
  # GHSA-r28c-9q8g-f849. 8.5.23 was already in the tree for @tailwindcss/postcss,
  # so this dedupes to one copy rather than adding a version.
  "postcss": "^8.5.23"
  # sharp 0.34.5 inherits the libvips CVEs in GHSA-f88m-g3jw-g9cj. The docs site
  # is a static export, so next never runs the image optimizer and never loads
  # sharp, but it ships in the lockfile either way, so it gets patched.
  "sharp": "^0.35.3"

patchedDependencies:
  image-size@1.2.1: patches/image-size@1.2.1.patch
  "minimatch@3.1.5": "patches/minimatch@3.1.5.patch"

# pnpm 11 renamed `onlyBuiltDependencies` to `allowBuilds`, which is a map so a
# package can also be explicitly denied.
allowBuilds:
  "@swc/core": true
  "esbuild": true
  "sharp": true

# Quarantine third-party releases for 14 days. This is also enforced by
# `--frozen-lockfile`, so exact versions already in the lockfile are grandfathered
# until they age past the window. Our own magic-* tooling can move immediately.
minimumReleaseAge: 20160

minimumReleaseAgeExclude:
